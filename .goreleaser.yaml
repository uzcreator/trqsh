# GoReleaser — cross-compile + package the CLI (trqsh) and edge (trqshd).
# The desktop app (Tauri) is built separately in desktop-build.yml; goreleaser
# only packages the Go binaries here. Run locally: `goreleaser release --clean --snapshot`.
#
# Source lives in uzcreator/trqsh, but the release itself publishes to the
# dedicated uzcreator/trqshcli repo (see release.github below) — needs a
# cross-repo token (RELEASE_REPO_TOKEN) in the workflow since the default
# GITHUB_TOKEN is scoped to the repo the workflow runs in.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: trqsh
    main: ./cmd/trqsh
    binary: trqsh
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - >-
        -s -w
        -X github.com/trqsh-uz/trqsh/internal/agent.Version={{.Version}}
        -X github.com/trqsh-uz/trqsh/internal/agent.Commit={{.ShortCommit}}
        -X github.com/trqsh-uz/trqsh/internal/agent.BuildDate={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: trqshd
    main: ./cmd/trqshd
    binary: trqshd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  # CLI (trqsh) — what users download. Built for every platform.
  - id: cli
    builds: [trqsh]
    name_template: "trqsh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
  # Edge server (trqshd) — Linux/macOS only; for self-hosting.
  - id: edge
    builds: [trqshd]
    name_template: "trqshd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Keyless-sign checksums.txt with cosign/Sigstore (via the release workflow's
# GitHub Actions OIDC token — no key material to manage or leak). Signing the
# checksum file is enough to cover every archive/package transitively, since
# each one's hash is listed in it. Verify a download with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/uzcreator/trqsh/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Homebrew tap — disabled for the first release. Re-enable once the tap repo
# (github.com/uzcreator/homebrew-tap) exists and HOMEBREW_TAP_TOKEN is set.
# brews:
#   - name: trqsh
#     ids: [default]
#     repository:
#       owner: uzcreator
#       name: homebrew-tap
#     homepage: "https://trqsh.uz"
#     description: "Expose localhost to the internet — fast."
#     license: "Apache-2.0"
#     install: |
#       bin.install "trqsh"

# Linux packages for the CLI + edge.
nfpms:
  - id: packages
    package_name: trqsh
    builds: [trqsh, trqshd]
    homepage: "https://trqsh.uz"
    description: "trqsh tunneling client (trqsh) and edge server (trqshd)."
    maintainer: "trqsh <ops@trqsh.uz>"
    license: "Apache-2.0"
    formats: [deb, rpm]
    bindir: /usr/bin

release:
  # Binaries ship as GitHub Releases on the dedicated uzcreator/trqshcli repo
  # (source stays in this monorepo — only the release/download surface moved,
  # so CLI users get a clean, download-only release list with no desktop-v*/
  # backend releases mixed in). The package managers (npm/pypi/scoop) and the
  # website point their downloads there too. The desktop GUI keeps releasing
  # to this repo (uzcreator/trqsh) under desktop-v* tags, unchanged.
  github:
    owner: uzcreator
    name: trqshcli
  name_template: "trqsh CLI v{{ .Version }}"
  draft: false
  prerelease: auto
  # Every GitHub release is created as a draft, has its assets uploaded, then
  # gets a final PATCH that un-drafts it and creates the real tag ref pointing
  # at target_commitish (defaults to trqshcli's own default branch HEAD). That
  # PATCH fails with a 422 "Repository is empty" if trqshcli has no commits to
  # point at yet — bit us on the very first cross-repo release, since a repo
  # created only to host releases starts with zero commits. Pinning this to
  # "main" removes the dependency on that implicit fallback ever resolving.
  target_commitish: main
