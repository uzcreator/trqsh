# GoReleaser — cross-compile + package the CLI (trqsh) and edge (trqshd).
# The desktop app (Tauri) is built separately in desktop-build.yml; goreleaser
# only packages the Go binaries here. Run locally: `goreleaser release --clean --snapshot`.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: trqsh
    main: ./cmd/trqsh
    binary: trqsh
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/trqsh-uz/trqsh/internal/agent.Version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: trqshd
    main: ./cmd/trqshd
    binary: trqshd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  # CLI (trqsh) — what users download. Built for every platform.
  - id: cli
    builds: [trqsh]
    name_template: "trqsh_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
  # Edge server (trqshd) — Linux/macOS only; for self-hosting.
  - id: edge
    builds: [trqshd]
    name_template: "trqshd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Homebrew tap — disabled for the first release. Re-enable once the tap repo
# (github.com/trqsh-uz/homebrew-tap) exists and HOMEBREW_TAP_TOKEN is set.
# brews:
#   - name: trqsh
#     ids: [default]
#     repository:
#       owner: uzcreator
#       name: homebrew-tap
#     homepage: "https://trqsh.uz"
#     description: "Expose localhost to the internet — fast."
#     license: "Apache-2.0"
#     install: |
#       bin.install "trqsh"

# Linux packages for the CLI + edge.
nfpms:
  - id: packages
    package_name: trqsh
    builds: [trqsh, trqshd]
    homepage: "https://trqsh.uz"
    description: "trqsh tunneling client (trqsh) and edge server (trqshd)."
    maintainer: "trqsh <ops@trqsh.uz>"
    license: "Apache-2.0"
    formats: [deb, rpm]
    bindir: /usr/bin

release:
  # Binaries ship as GitHub Releases on this same repo (uzcreator/trqsh); the
  # package managers (npm/pypi/scoop) and the website point their downloads here.
  github:
    owner: uzcreator
    name: trqsh
  draft: false
  prerelease: auto
