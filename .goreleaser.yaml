# GoReleaser — cross-compile + package the CLI (trqsh) and edge (trqshd).
# The desktop GUI is built + signed separately in release.yml (Wails needs CGO
# and per-OS signing). Run locally: `goreleaser release --clean --snapshot`.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: trqsh
    main: ./cmd/trqsh
    binary: trqsh
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: trqshd
    main: ./cmd/trqshd
    binary: trqshd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    builds: [trqsh, trqshd]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# Homebrew tap for the CLI (github.com/trqsh-uz/homebrew-tap).
brews:
  - name: trqsh
    ids: [default]
    repository:
      owner: trqsh-uz
      name: homebrew-tap
    homepage: "https://trqsh.uz"
    description: "Expose localhost to the internet — fast."
    license: "Apache-2.0"
    install: |
      bin.install "trqsh"

# Linux packages for the CLI + edge.
nfpms:
  - id: packages
    package_name: trqsh
    builds: [trqsh, trqshd]
    homepage: "https://trqsh.uz"
    description: "trqsh tunneling client (trqsh) and edge server (trqshd)."
    maintainer: "trqsh <ops@trqsh.uz>"
    license: "Apache-2.0"
    formats: [deb, rpm]
    bindir: /usr/bin

release:
  github:
    owner: trqsh-uz
    name: trqsh
  draft: false
  prerelease: auto
