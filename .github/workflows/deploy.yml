name: Deploy

# MANUAL ONLY (workflow_dispatch). The automatic push/tag triggers were removed
# on purpose: this workflow runs `helm upgrade` against secrets.KUBECONFIG_STAGING
# / KUBECONFIG_PROD, but production currently runs on a plain docker-compose VPS,
# NOT Kubernetes, and nobody has verified those kubeconfig secrets point at a real
# (possibly cost-incurring) cluster. Do NOT restore the push/tag triggers until the
# owner has verified the `staging` / `production` GitHub Environment secrets. When
# dispatched, the per-job `if:` below still gates on the ref: run from `main` for
# staging, from a `v*` tag for production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    # Deploy every green main build to staging.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > ~/.kube/config
      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install trqsh deploy/helm/trqsh \
            -f deploy/helm/trqsh/values.staging.yaml \
            --set image.tag=sha-$(git rev-parse --short HEAD) \
            --set edge.enabled=false \
            --set secrets.existingSecret=trqsh-secrets \
            --namespace trqsh --create-namespace --wait --timeout 5m

  production:
    # Tagged releases go to prod after manual approval (environment gate).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.16.3 }
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config
      - name: Helm upgrade (production)
        run: |
          helm upgrade --install trqsh deploy/helm/trqsh \
            -f deploy/helm/trqsh/values.prod.yaml \
            --set image.tag=${{ github.ref_name }} \
            --set edge.enabled=false \
            --set secrets.existingSecret=trqsh-secrets \
            --namespace trqsh --create-namespace --wait --timeout 10m
