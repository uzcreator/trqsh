name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  go:
    name: Go build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Check embedded OpenAPI is current
        run: |
          cp docs/openapi.yaml internal/api/openapi.yaml
          git diff --exit-code internal/api/openapi.yaml \
            || (echo "::error::internal/api/openapi.yaml is stale — run 'make openapi-sync'"; exit 1)
      - name: Test (race)
        run: go test ./... -race -count=1
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        # Built from source (not golangci-lint-action's prebuilt release) so it
        # always compiles with the same toolchain setup-go just installed.
        # golangci-lint's releases lag behind fresh Go versions — "latest"
        # pinned to a go1.24 build has repeatedly rejected this repo's
        # go1.25+ go.mod (a known, recurring upstream issue, not specific to
        # any one Go release: golangci/golangci-lint#5873, #6127, #6272).
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

  frontends:
    name: Frontend builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web/dashboard, web/site, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - name: Install
        working-directory: ${{ matrix.app }}
        run: pnpm install --frozen-lockfile
      # web/site's pricing catalog and OpenAPI copy are fetched from the live
      # control API at TRQSH_API_URL (default api.trqsh.uz) rather than built
      # from local backend source — see lib/paths.ts and scripts/genplans.mjs.
      # This step requires that API to be reachable; if it's down, this check
      # (not the rest of CI) fails until it's back.
      - name: Check generated plan catalog + OpenAPI copy are current
        if: matrix.app == 'web/site'
        working-directory: web/site
        run: |
          node scripts/genplans.mjs
          node scripts/gen-openapi.mjs
          git diff --exit-code lib/catalog.generated.ts lib/openapi.generated.yaml \
            || (echo "::error::web/site's generated files are stale — run 'make site-plans site-openapi'"; exit 1)
      - name: Build
        working-directory: ${{ matrix.app }}
        run: pnpm build

  helm:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint
        run: helm lint deploy/helm/trqsh -f deploy/helm/trqsh/values.staging.yaml
      - name: Template (render must succeed)
        run: |
          helm template trqsh deploy/helm/trqsh \
            -f deploy/helm/trqsh/values.staging.yaml \
            --set secrets.existingSecret=trqsh-secrets > /dev/null

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform -chdir=deploy/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose -f deploy/docker-compose.dev.yml config --quiet
