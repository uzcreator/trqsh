name: gui-build

# Build the desktop GUI (Wails v3) and publish it to the trqsh-uz/gui repo.
# Manual for now (unsigned "unknown publisher" builds) — run from the Actions
# tab. Windows first; macOS/Linux legs can be added once signing is sorted.
#
# We build the Go binary directly (go build) instead of `wails3 build`: the
# alpha CLI's build is a Taskfile alias this project never scaffolded, and the
# React frontend is embedded via //go:embed all:frontend/dist, so a plain
# `go build -H windowsgui` produces a working, self-contained app.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "gui release tag to publish (e.g. 0.1.2)"
        required: true
        default: "0.1.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Build frontend (embedded by the Go binary)
        shell: bash
        working-directory: gui/frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build GUI (unsigned)
        shell: bash
        working-directory: gui
        env:
          # Wails v3 on Windows loads WebView2 via pure-Go go-winloader — no cgo,
          # no C toolchain. Verified building a working .exe with CGO off.
          CGO_ENABLED: "0"
          GOWORK: "off" # gui is its own module, excluded from the root go.work
        run: |
          mkdir -p bin
          go build -tags production \
            -ldflags "-H windowsgui -s -w -X main.version=${{ inputs.version }}" \
            -o bin/trqsh-gui.exe .

      - name: List output
        if: always()
        shell: bash
        working-directory: gui
        run: ls -la bin || true

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trqsh-gui-windows
          path: gui/bin/*
          if-no-files-found: warn

      - name: Publish .exe to the gui release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          out="trqsh-gui_${{ inputs.version }}_windows_amd64.exe"
          cp gui/bin/trqsh-gui.exe "$out"
          gh release create "v${{ inputs.version }}" --repo trqsh-uz/gui \
            --title "trqsh desktop v${{ inputs.version }}" \
            --notes "Unsigned preview build. Windows SmartScreen may warn 'unknown publisher' — click More info then Run anyway." \
            2>/dev/null || true
          gh release upload "v${{ inputs.version }}" "$out" --repo trqsh-uz/gui --clobber
