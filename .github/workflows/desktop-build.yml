name: desktop-build

# Builds the trqsh desktop app (Tauri v2) for Windows, macOS, and Linux and
# uploads the installers as artifacts. Optionally publishes them to the public
# trqsh-uz/gui releases repo (opt-in, so unsigned preview builds don't ship by
# accident).
#
# The app is a thin native client: the Go agent is bundled as a sidecar binary
# (src-tauri/binaries/trqsh-<target-triple>). Rather than compiling it from this
# repo's own Go source (desktop/ doesn't carry backend source), each runner
# downloads the matching platform/arch archive already published to the public
# trqsh-uz/cli releases and renames the binary inside it to the Rust host
# triple Tauri resolves at bundle time. This means a desktop build bundles
# whichever CLI version was most recently released there, not this repo's
# tip-of-main — a deliberate tradeoff: no Go toolchain needed in this
# workflow, no cross-repo secret beyond the default GITHUB_TOKEN (trqsh-uz/cli
# is public).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0), used when publishing"
        required: true
        default: "0.2.0"
      publish:
        description: "Publish installers to trqsh-uz/gui"
        type: boolean
        default: false
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: darwin
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # WebKitGTK + packaging tools for the Linux bundle (AppImage/deb/rpm).
      - name: Install Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev rpm

      # Download the trqsh CLI/agent release archive matching this runner's
      # OS+arch from the public trqsh-uz/cli releases, verify its checksum
      # (same checksums.txt mechanism packaging/install.sh uses), and drop the
      # extracted binary in as the Tauri sidecar under the Rust host triple
      # (e.g. trqsh-x86_64-pc-windows-msvc.exe).
      - name: Download trqsh agent sidecar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          [ "${{ matrix.platform }}" = "windows" ] && ext=".exe"

          case "${{ matrix.platform }}" in
            windows) goos=windows; fmt=zip ;;
            darwin)  goos=darwin;  fmt=tar.gz ;;
            linux)   goos=linux;   fmt=tar.gz ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  goarch=amd64 ;;
            arm64|aarch64) goarch=arm64 ;;
            *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
          esac

          version="$(gh release view --repo trqsh-uz/cli --json tagName -q .tagName | sed 's/^v//')"
          archive="trqsh_${version}_${goos}_${goarch}.${fmt}"
          echo "downloading ${archive} (trqsh-uz/cli v${version}) for triple ${triple}"

          tmp="$(mktemp -d)"
          gh release download "v${version}" --repo trqsh-uz/cli \
            --pattern "$archive" --pattern checksums.txt --dir "$tmp"

          checksum() { command -v sha256sum >/dev/null 2>&1 && sha256sum "$1" || shasum -a 256 "$1"; }
          want="$(grep " ${archive}\$" "$tmp/checksums.txt" | awk '{print $1}')"
          got="$(checksum "$tmp/$archive" | awk '{print $1}')"
          [ "$want" = "$got" ] || { echo "::error::checksum mismatch for $archive"; exit 1; }

          mkdir -p "$tmp/extracted" desktop/src-tauri/binaries
          if [ "$fmt" = "zip" ]; then
            unzip -o "$tmp/$archive" -d "$tmp/extracted"
          else
            tar -xzf "$tmp/$archive" -C "$tmp/extracted"
          fi
          mv "$tmp/extracted/trqsh${ext}" "desktop/src-tauri/binaries/trqsh-${triple}${ext}"
          ls -la desktop/src-tauri/binaries

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build

      # Gather every installer this platform produced into one folder.
      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base=desktop/src-tauri/target/release/bundle
          find "$base" -type f \( \
              -name "*.exe" -o -name "*.msi" -o \
              -name "*.dmg" -o -name "*.app.tar.gz" -o \
              -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            \) -exec cp {} out/ \; 2>/dev/null || true
          echo "Collected:"; ls -la out

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: trqsh-desktop-${{ matrix.platform }}
          path: out/*
          if-no-files-found: warn

  # Publish all installers to the public trqsh-uz/gui release. Opt-in via the
  # workflow_dispatch `publish` input, or automatic on a desktop-v* tag.
  publish:
    needs: build
    if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#desktop-v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to trqsh-uz/gui
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          v="${{ steps.v.outputs.version }}"
          find dist -type f | sort
          gh release create "v$v" --repo trqsh-uz/gui \
            --title "trqsh desktop v$v" \
            --notes "Unsigned preview build. Windows SmartScreen may warn 'unknown publisher' — click More info then Run anyway. macOS: right-click → Open the first time." \
            2>/dev/null || true
          find dist -type f -exec gh release upload "v$v" {} --repo trqsh-uz/gui --clobber \;
