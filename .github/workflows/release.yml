name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create releases + upload assets

jobs:
  # CLI + edge binaries, archives, checksums, Homebrew tap, deb/rpm.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --clean
        env:
          # PAT with contents:write on the PUBLIC trqsh-uz/cli repo, so the
          # release + assets land there (source stays private in trqsh-uz/trqsh).
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Desktop GUI (Wails v3) — one signed bundle per OS. Opt-in: needs signing /
  # notarization secrets, so it only runs when the repo variable RELEASE_GUI=true.
  gui:
    if: ${{ vars.RELEASE_GUI == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: gui/frontend/pnpm-lock.yaml }

      - name: Install Linux WebKit deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Build GUI
        working-directory: gui
        run: |
          wails3 build -clean -tags production
        env:
          VERSION: ${{ github.ref_name }}

      # --- Signing (secrets provided in the repo's release environment) ---
      - name: Notarize (macOS)
        if: matrix.platform == 'darwin'
        run: |
          # codesign the .app, then submit for notarization.
          xcrun notarytool submit gui/bin/Trqsh.app.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

      - name: Sign (Windows Authenticode)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # AzureSignTool / signtool with the code-signing cert.
          echo "signtool sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 gui/bin/trqsh-gui.exe"
        env:
          WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Upload installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gui/bin/*

  # Publish the auto-update feed the GUI/CLI poll (see gui/update.go).
  update-feed:
    needs: [cli, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate feed
        run: |
          bash deploy/release/gen-update-feed.sh "${{ github.ref_name }}" > latest.json
          cat latest.json
      - name: Publish feed to Spaces (downloads.trqsh.uz/desktop/latest.json)
        run: |
          echo "Uploading latest.json to the releases bucket via s3cmd/aws-cli…"
          # aws s3 cp latest.json s3://trqsh-releases/desktop/latest.json --acl public-read
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_ENDPOINT_URL: https://fra1.digitaloceanspaces.com

  # Publish the npm wrapper (npx trqsh / npm i -g trqsh). Runs after the release
  # exists so the binary + checksums are downloadable. Skips cleanly if NPM_TOKEN
  # isn't configured, so it never blocks a binary release.
  npm:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        working-directory: packaging/npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish the PyPI wrapper (pip install trqsh). Skips cleanly if PYPI_TOKEN
  # isn't configured.
  pypi:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build & publish to PyPI
        working-directory: packaging/pypi
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN secret not set — skipping PyPI publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade build twine
          sed -i -E "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VER\"/" src/trqsh/__init__.py
          python -m build
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
