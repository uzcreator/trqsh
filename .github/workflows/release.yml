name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create releases + upload assets

jobs:
  # CLI + edge binaries, archives, checksums, Homebrew tap, deb/rpm.
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create releases + upload assets
      id-token: write # cosign keyless signing (Sigstore OIDC) — see .goreleaser.yaml signs:
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> 2"
          args: release --clean
        env:
          # Cross-repo release: .goreleaser.yaml publishes to uzcreator/trqshcli,
          # not this (uzcreator/trqsh) repo, so the workflow's own GITHUB_TOKEN
          # (scoped only to the repo it runs in) can't create the release or
          # upload assets there. RELEASE_REPO_TOKEN is a classic PAT with repo
          # scope on trqshcli — set it in this repo's Settings > Secrets >
          # Actions. Until it's set, this step fails with a 404/403 creating
          # the release (everything else in this workflow is unaffected).
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # Publish the npm wrapper (npx trqsh / npm i -g trqsh). Runs after the release
  # exists so the binary + checksums are downloadable. Skips cleanly if NPM_TOKEN
  # isn't configured, so it never blocks a binary release.
  npm:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        working-directory: packaging/npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          npm version "$VER" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish the PyPI wrapper (pip install trqsh). Skips cleanly if PYPI_TOKEN
  # isn't configured.
  pypi:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build & publish to PyPI
        working-directory: packaging/pypi
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "PYPI_TOKEN secret not set — skipping PyPI publish."; exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          python -m pip install --upgrade build twine
          sed -i -E "s/^version = \".*\"/version = \"$VER\"/" pyproject.toml
          sed -i -E "s/^__version__ = \".*\"/__version__ = \"$VER\"/" src/trqsh/__init__.py
          python -m build
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
