name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: edge
            dockerfile: deploy/docker/Dockerfile.edge
            extra_build_args: ""
          - name: api
            dockerfile: deploy/docker/Dockerfile.api
            extra_build_args: ""
          - name: migrate
            dockerfile: deploy/docker/Dockerfile.migrate
            extra_build_args: ""
          # The dashboard is Next.js: TRQSH_API_URL / NEXT_PUBLIC_TRQSH_BASE_DOMAIN
          # are inlined at BUILD time, so the prod values must be baked into the
          # published image (the Dockerfile defaults are localhost:8080 / lvh.me).
          - name: dashboard
            dockerfile: deploy/docker/Dockerfile.dashboard
            extra_build_args: |
              TRQSH_API_URL=https://api.trqsh.uz
              NEXT_PUBLIC_TRQSH_BASE_DOMAIN=trqsh.uz
          - name: site
            dockerfile: deploy/docker/Dockerfile.site
            extra_build_args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            ${{ matrix.extra_build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
