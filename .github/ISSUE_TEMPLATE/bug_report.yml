name: Bug report
description: Report a problem with trqsh
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `trqsh http 3000 ...`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - agent / CLI (trqsh)
        - edge (trqshd)
        - control API (trqshapi)
        - dashboard
        - marketing site
        - desktop app (GUI)
        - other / unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: output of `trqsh version`
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: macOS 14 arm64 / Windows 11 x64 / Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact any tokens/keys.
      render: shell
