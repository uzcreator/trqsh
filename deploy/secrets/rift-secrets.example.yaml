# Example of the Secret the chart expects (secrets.existingSecret). Fill real
# values, encrypt with SOPS (`sops -e -i rift-secrets.enc.yaml`), and commit the
# ENCRYPTED file — never this plaintext one.
#
#   cp rift-secrets.example.yaml rift-secrets.enc.yaml
#   sops -e -i rift-secrets.enc.yaml
#   sops -d rift-secrets.enc.yaml | kubectl apply -n rift -f -
apiVersion: v1
kind: Secret
metadata:
  name: rift-secrets
  namespace: rift
type: Opaque
stringData:
  RIFT_JWT_SECRET: "replace-with-64-hex-chars"
  RIFT_INTERNAL_TOKEN: "replace-with-shared-edge-api-token"
  RIFT_DATABASE_URL: "postgres://user:pass@host:5432/rift?sslmode=require"
  RIFT_REDIS_URL: "rediss://user:pass@host:6379/0"
  # Billing (optional; leave empty to disable).
  RIFT_STRIPE_SECRET_KEY: ""
  RIFT_STRIPE_WEBHOOK_SECRET: ""
