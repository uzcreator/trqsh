# Example of the Secret the chart expects (secrets.existingSecret). Fill real
# values, encrypt with SOPS (`sops -e -i trqsh-secrets.enc.yaml`), and commit the
# ENCRYPTED file — never this plaintext one.
#
#   cp trqsh-secrets.example.yaml trqsh-secrets.enc.yaml
#   sops -e -i trqsh-secrets.enc.yaml
#   sops -d trqsh-secrets.enc.yaml | kubectl apply -n trqsh -f -
apiVersion: v1
kind: Secret
metadata:
  name: trqsh-secrets
  namespace: trqsh
type: Opaque
stringData:
  TRQSH_JWT_SECRET: "replace-with-64-hex-chars"
  TRQSH_INTERNAL_TOKEN: "replace-with-shared-edge-api-token"
  TRQSH_DATABASE_URL: "postgres://user:pass@host:5432/trqsh?sslmode=require"
  TRQSH_REDIS_URL: "rediss://user:pass@host:6379/0"
  # Admin console (approve.<domain>): fleet dashboard + subscription grants.
  # Both must be set to enable it; leave empty to disable.
  TRQSH_ADMIN_USER: ""
  TRQSH_ADMIN_PASSWORD: ""
  # Location / geo (optional): country detection for /v1/geo + history/admin.
  # Set the CDN header OR an external provider URL ({ip} placeholder); blank = off.
  TRQSH_GEOIP_HEADER: ""
  TRQSH_GEOIP_API: ""
  TRQSH_REGIONS: ""
  # OAuth (optional; public web sign-up).
  TRQSH_GITHUB_CLIENT_ID: ""
  TRQSH_GITHUB_CLIENT_SECRET: ""
  TRQSH_GOOGLE_CLIENT_ID: ""
  TRQSH_GOOGLE_CLIENT_SECRET: ""
  # Billing (optional; leave empty to disable). Price/meter IDs from Stripe.
  TRQSH_STRIPE_SECRET_KEY: ""
  TRQSH_STRIPE_WEBHOOK_SECRET: ""
  TRQSH_STRIPE_PRICE_PRO_MONTHLY: ""
  TRQSH_STRIPE_PRICE_PRO_ANNUAL: ""
  TRQSH_STRIPE_PRICE_TEAM_MONTHLY: ""
  TRQSH_STRIPE_PRICE_TEAM_ANNUAL: ""
  TRQSH_STRIPE_PRICE_PAYG_METERED: ""
  TRQSH_STRIPE_METER_BANDWIDTH: ""
  TRQSH_STRIPE_METER_REQUESTS: ""
  # TLS: Cloudflare API token (Zone.DNS:Edit) for the *.trqsh.uz wildcard cert via
  # DNS-01. Optional — without it, subdomains use on-demand TLS-ALPN issuance.
  TRQSH_CLOUDFLARE_API_TOKEN: ""
