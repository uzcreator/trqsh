# Production overrides. Real Let's Encrypt certs, larger footprint, HA.

image:
  tag: "" # set by CI to the released tag

common:
  baseDomain: rift.sh

secrets:
  existingSecret: rift-secrets

api:
  replicaCount: 3
  publicURL: https://api.rift.sh
  devAuth: false
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65
  pdb:
    enabled: true
    minAvailable: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }

edge:
  acme:
    staging: false
    email: ops@rift.dev
  resources:
    requests: { cpu: 500m, memory: 256Mi }
    limits: { cpu: "4", memory: 2Gi }

dashboard:
  replicaCount: 3

ingress:
  className: nginx
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
  hosts:
    api: api.rift.sh
    app: app.rift.sh

serviceMonitor:
  enabled: true

networkPolicy:
  enabled: true
