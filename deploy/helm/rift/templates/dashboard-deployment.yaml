{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rift.fullname" . }}-dashboard
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "rift.selectorLabels" (dict "root" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rift.selectorLabels" (dict "root" . "component" "dashboard") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rift.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dashboard
          image: {{ include "rift.image" (dict "root" . "repo" .Values.dashboard.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
          env:
            - name: RIFT_API_URL
              value: "http://{{ include "rift.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: NODE_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
