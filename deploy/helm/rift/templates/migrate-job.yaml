{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rift.fullname" . }}-migrate
  labels:
    {{- include "rift.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before the API rolls out, on both install and upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "rift.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rift.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: migrate
          image: {{ include "rift.image" (dict "root" . "repo" .Values.migrations.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["up"]
          env:
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: {{ include "rift.secretName" . }}
                  key: RIFT_DATABASE_URL
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
