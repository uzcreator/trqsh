{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Chart-created Secret — DEV/throwaway clusters only. In staging/prod pre-create
# the Secret (SOPS / sealed-secrets / cloud KMS) and set secrets.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rift.secretName" . }}
  labels:
    {{- include "rift.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.data }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
