{{- if .Values.edge.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "trqsh.fullname" . }}-edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trqsh.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge
spec:
  selector:
    matchLabels:
      {{- include "trqsh.selectorLabels" (dict "root" . "component" "edge") | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "trqsh.selectorLabels" (dict "root" . "component" "edge") | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "trqsh.serviceAccountName" . }}
      # Own :80/:443 (TCP+UDP) directly on each edge node; still resolve cluster
      # DNS (the api Service) via ClusterFirstWithHostNet.
      # trivy:ignore:AVD-KSV-0009 -- required to own the host's :80/:443/QUIC directly (real client IPs, no Service/NAT hop); this DaemonSet is the optional self-hosted-k8s edge path, not the primary per-region-droplet deployment (see deploy/terraform/edge.tf)
      hostNetwork: {{ .Values.edge.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        # gcr.io/distroless/static:nonroot's fixed UID/GID (Dockerfile.edge: USER nonroot:nonroot).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM triggers the edge's graceful drain (ShutdownMsg to agents).
      terminationGracePeriodSeconds: {{ add .Values.edge.drainTimeoutSeconds 5 }}
      {{- with .Values.edge.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.edge.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        # trivy:ignore:AVD-KSV-0125 -- pulled exclusively from our own registry (values.yaml image.registry: ghcr.io/uzcreator)
        - name: edge
          image: {{ include "trqsh.image" (dict "root" . "repo" .Values.edge.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # trivy:ignore:AVD-KSV-0117 -- binding :80/:443 is this component's job (public HTTP/HTTPS termination); scoped to CAP_NET_BIND_SERVICE only, not root, below
          # trivy:ignore:AVD-KSV-0022 -- the one added capability (NET_BIND_SERVICE) is exactly what's needed to bind :80/:443 as non-root; ALL others are dropped above
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: http
              containerPort: {{ .Values.edge.ports.http }}
              protocol: TCP
            - name: https
              containerPort: {{ .Values.edge.ports.https }}
              protocol: TCP
            # HTTP/3 (QUIC) shares the HTTPS port over UDP.
            - name: https-udp
              containerPort: {{ .Values.edge.ports.https }}
              protocol: UDP
            - name: agent-tcp
              containerPort: {{ .Values.edge.ports.agent }}
              protocol: TCP
            - name: agent-udp
              containerPort: {{ .Values.edge.ports.agent }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.edge.ports.metrics }}
              protocol: TCP
          env:
            - name: TRQSH_HTTP_ADDR
              value: ":{{ .Values.edge.ports.http }}"
            - name: TRQSH_HTTPS_ADDR
              value: ":{{ .Values.edge.ports.https }}"
            # HTTP/3 (QUIC) ingress on the same UDP port as HTTPS. hostNetwork
            # means the bound port is the public port, so no advertise-port
            # override is needed. Open the HTTPS UDP port on the node firewall.
            - name: TRQSH_H3_ADDR
              value: ":{{ .Values.edge.ports.https }}"
            - name: TRQSH_QUIC_ADDR
              value: ":{{ .Values.edge.ports.agent }}"
            - name: TRQSH_TCP_ADDR
              value: ":{{ .Values.edge.ports.agent }}"
            - name: TRQSH_METRICS_ADDR
              value: ":{{ .Values.edge.ports.metrics }}"
            - name: TRQSH_BASE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "trqsh.fullname" . }}-config
                  key: TRQSH_BASE_DOMAIN
            - name: TRQSH_REGION
              value: {{ .Values.edge.region | default .Values.common.baseDomain | quote }}
            - name: TRQSH_EDGE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TRQSH_ENTITLEMENTS
              value: "api"
            - name: TRQSH_API_URL
              value: "http://{{ include "trqsh.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: TRQSH_PORT_MIN
              value: {{ .Values.edge.portRange.min | quote }}
            - name: TRQSH_PORT_MAX
              value: {{ .Values.edge.portRange.max | quote }}
            - name: TRQSH_ACME_EMAIL
              value: {{ .Values.edge.acme.email | quote }}
            - name: TRQSH_ACME_STAGING
              value: {{ .Values.edge.acme.staging | ternary "1" "0" | quote }}
            # DNS-01 wildcard token (optional): with it, one *.<base> cert covers
            # every subdomain; without it, subdomains fall back to on-demand issuance.
            - name: TRQSH_CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trqsh.secretName" . }}
                  key: TRQSH_CLOUDFLARE_API_TOKEN
                  optional: true
            - name: TRQSH_TLS_STORAGE_DIR
              value: {{ .Values.edge.acme.storageDir | quote }}
            - name: TRQSH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "trqsh.secretName" . }}
                  key: TRQSH_INTERNAL_TOKEN
            - name: TRQSH_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "trqsh.secretName" . }}
                  key: TRQSH_REDIS_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.edge.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # ACME cert cache (TRQSH_TLS_STORAGE_DIR above) — only used as a
            # fallback when TRQSH_REDIS_URL isn't set (Stage C shared cert
            # store); still needs to be writable either way now that the root
            # filesystem is read-only.
            - name: certs
              mountPath: {{ .Values.edge.acme.storageDir }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: certs
          emptyDir: {}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
