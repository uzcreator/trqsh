# Full local trqsh stack (Part 08). Brings up the M1 product end-to-end:
#   Postgres + Redis + migrations + control API + edge + dev mail.
# The dashboard and the observability stack are opt-in via profiles.
#
#   make dev                 # core stack (pg, redis, migrate, api, edge, mailhog)
#   make dev-web             # + the Next.js dashboard          (profile: web)
#   make observability       # + Prometheus/Grafana/OTel        (profile: observability)
#   make dev-deps            # just Postgres + Redis (for `go run` workflows)
#
# Dev secrets below are non-secret defaults for localhost only. Override via a
# deploy/.env file (see deploy/.env.example). Never use these in staging/prod.

x-internal-token: &internal_token ${TRQSH_INTERNAL_TOKEN:-dev-internal-token}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trqsh
      POSTGRES_PASSWORD: trqsh
      POSTGRES_DB: trqsh
    ports:
      - "5432:5432"
    volumes:
      - trqsh_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trqsh -d trqsh"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - trqsh_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration. Runs goose `up`, then exits 0.
  migrate:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.migrate
    environment:
      GOOSE_DBSTRING: postgres://trqsh:trqsh@postgres:5432/trqsh?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Control plane: accounts, keys, domains, quotas, entitlements, billing.
  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      TRQSH_API_ADDR: ":8080"
      TRQSH_DATABASE_URL: postgres://trqsh:trqsh@postgres:5432/trqsh?sslmode=disable
      TRQSH_REDIS_URL: redis://redis:6379/0
      TRQSH_BASE_DOMAIN: lvh.me
      TRQSH_API_PUBLIC_URL: http://localhost:8080
      TRQSH_JWT_SECRET: ${TRQSH_JWT_SECRET:-dev-jwt-secret-change-me}
      TRQSH_INTERNAL_TOKEN: *internal_token
      TRQSH_DEV_AUTH: "1"
      TRQSH_TRUST_PROXY: "1"
      # Billing is off unless you supply Stripe test keys in deploy/.env.
      TRQSH_STRIPE_SECRET_KEY: ${TRQSH_STRIPE_SECRET_KEY:-}
      TRQSH_STRIPE_WEBHOOK_SECRET: ${TRQSH_STRIPE_WEBHOOK_SECRET:-}
      # Admin console (approve.lvh.me) — set both in deploy/.env to enable locally.
      TRQSH_ADMIN_USER: ${TRQSH_ADMIN_USER:-}
      TRQSH_ADMIN_PASSWORD: ${TRQSH_ADMIN_PASSWORD:-}
      # Location/geo (optional): country detection for /v1/geo + history/admin.
      TRQSH_GEOIP_HEADER: ${TRQSH_GEOIP_HEADER:-}
      TRQSH_GEOIP_API: ${TRQSH_GEOIP_API:-}
      TRQSH_REGIONS: ${TRQSH_REGIONS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Edge data plane: public ingress + agent sessions. Talks to the real API for
  # entitlements. Dev uses self-signed TLS (TRQSH_ACME_STAGING=1).
  edge:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.edge
    environment:
      TRQSH_BASE_DOMAIN: lvh.me
      TRQSH_REGION: local
      TRQSH_EDGE_ID: edge-local
      TRQSH_REDIS_URL: redis://redis:6379/0
      TRQSH_ENTITLEMENTS: api
      TRQSH_API_URL: http://api:8080
      TRQSH_INTERNAL_TOKEN: *internal_token
      TRQSH_ACME_STAGING: "1"
      TRQSH_ACME_EMAIL: dev@localhost
      TRQSH_METRICS_ADDR: ":9090"
    ports:
      - "80:80"        # HTTP ingress
      - "443:443"      # HTTPS ingress
      - "4443:4443/tcp"  # agent TCP fallback
      - "4443:4443/udp"  # agent QUIC
      - "9090:9090"    # metrics + health
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  # Dev SMTP sink (magic-link / verification emails). UI on :8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # --- opt-in: web dashboard (profile: web) ---
  dashboard:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.dashboard
    environment:
      TRQSH_API_URL: http://api:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  # --- opt-in: observability (profile: observability) ---
  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  trqsh_pg:
  trqsh_redis:
