# Alert rules over the real edge metrics (internal/server/metrics.go).
groups:
  - name: trqsh-edge
    rules:
      - alert: TrqshEdgeDown
        expr: up{job="trqsh-edge"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Edge {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape the edge for over 1m."

      - alert: TrqshEdgeHighErrorRate
        # Sustained edge errors across any kind.
        expr: sum(rate(trqsh_errors_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated edge error rate"
          description: "trqsh_errors_total is averaging >1/s over 10m (by kind: {{ $labels.kind }})."

      - alert: TrqshNoActiveSessions
        # A live edge should normally hold sessions; zero for a long window on a
        # production edge usually means agents can't connect.
        expr: max_over_time(trqsh_sessions_active[15m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No agent sessions on {{ $labels.instance }}"
          description: "trqsh_sessions_active has been 0 for 15m."

      - alert: TrqshQUICFallbackSpike
        # If almost all handshakes fall back to TCP, QUIC/UDP is likely blocked
        # on the path — the latency differentiator is degraded.
        expr: |
          sum(rate(trqsh_agent_handshakes_total{kind="tcp"}[10m]))
            /
          clamp_min(sum(rate(trqsh_agent_handshakes_total[10m])), 0.001) > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Most agent handshakes are falling back to TCP"
          description: ">80% of handshakes are TCP over 10m; check UDP/QUIC reachability."

      - alert: TrqshForwardFailureRateHigh
        # Cross-edge forwarding (multi-edge only): a growing share of outgoing
        # forward attempts ending in forward_dial/forward_write usually means a peer
        # edge is unreachable (down, draining, network partition, or a stale/wrong
        # TRQSH_FORWARD_ADVERTISE_ADDR) — a ratio catches this even at low absolute
        # volume, where TrqshEdgeHighErrorRate's >1/s absolute threshold would not.
        expr: |
          sum(rate(trqsh_errors_total{kind=~"forward_dial|forward_write"}[5m]))
            /
          clamp_min(
            sum(rate(trqsh_errors_total{kind=~"forward_dial|forward_write"}[5m]))
              + sum(rate(trqsh_forwards_total{dir="out"}[5m])),
            0.001
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High cross-edge forward failure rate"
          description: ">20% of outgoing forward attempts have failed over 10m; check peer edge health and forwarding-address advertisement."
