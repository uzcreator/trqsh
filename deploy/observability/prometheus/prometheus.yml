# Prometheus scrape config for the local observability stack (compose profile
# "observability"). In Kubernetes, the Prometheus Operator ServiceMonitor
# (deploy/helm) replaces this.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The edge exposes /metrics on its metrics/health port (TRQSH_METRICS_ADDR).
  - job_name: trqsh-edge
    metrics_path: /metrics
    static_configs:
      - targets: ["edge:9090"]
        labels:
          component: edge
          region: local
