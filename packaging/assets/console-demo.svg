<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The real trqsh console: welcome banner, a live tunnel, and pinned traffic/status panels above the prompt">
  <rect x="0.5" y="0.5" width="999" height="579" rx="8" fill="#0a0a0a" stroke="#1c1c1c"/>

  <g font-family="ui-monospace,'Cascadia Code','Segoe UI Mono',Consolas,Menlo,monospace">
    <!-- header -->
    <text x="24" y="32" font-size="15" font-weight="700" fill="#2dd4bf">trqsh 0.1.9</text>
    <text x="976" y="32" font-size="14" text-anchor="end"><tspan fill="#22c55e">● online</tspan><tspan fill="#6b7280">   pro plan · 1 tunnel</tspan></text>
    <line x1="24" y1="44" x2="976" y2="44" stroke="#242424" stroke-width="1"/>

    <!-- welcome box (border only, no fill — matches the real console) -->
    <rect x="24" y="64" width="952" height="124" rx="10" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="36" y="58" width="128" height="16" fill="#0a0a0a"/>
    <text x="44" y="69" font-size="13" font-weight="700" fill="#2dd4bf">trqsh 0.1.9</text>

    <!-- mascot -->
    <g font-size="14">
      <text x="44" y="94" fill="#f5a05a"> ,_,</text>
      <text x="44" y="112"><tspan fill="#f5a05a">{</tspan><tspan fill="#38bdf8">O</tspan><tspan fill="#f472b6">,</tspan><tspan fill="#38bdf8">O</tspan><tspan fill="#f5a05a">}</tspan></text>
      <text x="44" y="130" fill="#f5a05a">/)_)</text>
    </g>

    <!-- account -->
    <g font-size="14">
      <text x="104" y="94" font-weight="700" fill="#2dd4bf">Welcome, Otash</text>
      <text x="104" y="112" font-size="13" fill="#6b7280">otash@example.com</text>
      <text x="104" y="130" font-size="13"><tspan fill="#6b7280">pro plan · </tspan><tspan fill="#22c55e">● online</tspan></text>
    </g>

    <line x1="330" y1="80" x2="330" y2="160" stroke="#242424" stroke-width="1"/>

    <!-- getting started -->
    <g font-size="13">
      <text x="348" y="94" font-weight="700" fill="#2dd4bf">Getting started</text>
      <text x="348" y="114"><tspan font-weight="700" fill="#2dd4bf">/</tspan><tspan fill="#6b7280">              browse all commands</tspan></text>
      <text x="348" y="134"><tspan font-weight="700" fill="#2dd4bf">/http 3000</tspan><tspan fill="#6b7280">   expose a local port</tspan></text>
      <text x="348" y="154"><tspan font-weight="700" fill="#2dd4bf">/qr</tspan><tspan fill="#6b7280">          QR to open on your phone</tspan></text>
    </g>

    <!-- transcript: a command just run -->
    <text x="24" y="222" font-size="15"><tspan fill="#2dd4bf" font-weight="700">❯ </tspan><tspan fill="#e5e7eb" font-weight="700">/http 3000</tspan></text>
    <text x="40" y="248" font-size="14"><tspan fill="#22c55e" font-weight="700">✓ </tspan><tspan fill="#6b7280">tunnel live  →  </tspan><tspan fill="#2dd4bf" font-weight="700">https://swift-otter.trqsh.uz</tspan></text>

    <!-- pinned panels: /pin traffic status -->
    <g>
      <rect x="24" y="276" width="580" height="150" rx="10" fill="#16302b" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.4"/>
      <rect x="40" y="270" width="70" height="15" fill="#0a0a0a"/>
      <text x="44" y="281" font-size="13" font-weight="700" fill="#38bdf8">TRAFFIC</text>
      <g font-size="13.5">
        <text x="44" y="312"><tspan fill="#22c55e">GET   </tspan><tspan fill="#22c55e">200</tspan><tspan fill="#c7d2ce"> /</tspan></text>
        <text x="44" y="338"><tspan fill="#22c55e">GET   </tspan><tspan fill="#22c55e">200</tspan><tspan fill="#c7d2ce"> /api/health</tspan></text>
        <text x="44" y="364"><tspan fill="#38bdf8">POST  </tspan><tspan fill="#22c55e">201</tspan><tspan fill="#c7d2ce"> /api/login</tspan></text>
        <text x="44" y="390"><tspan fill="#22c55e">GET   </tspan><tspan fill="#22c55e">200</tspan><tspan fill="#c7d2ce"> /static/app.js</tspan></text>
      </g>

      <rect x="620" y="276" width="356" height="150" rx="10" fill="#16302b" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1.4"/>
      <rect x="636" y="270" width="66" height="15" fill="#0a0a0a"/>
      <text x="640" y="281" font-size="13" font-weight="700" fill="#a78bfa">STATUS</text>
      <g font-size="13.5">
        <text x="640" y="316" fill="#22c55e">● online</text>
        <text x="640" y="342" fill="#6b7280">edge eu</text>
        <text x="640" y="368" fill="#6b7280">quic · 1 tunnel</text>
      </g>
    </g>

    <!-- input box -->
    <rect x="24" y="456" width="952" height="50" rx="10" fill="none" stroke="#2d443e" stroke-width="1.4"/>
    <text x="44" y="486" font-size="15"><tspan fill="#2dd4bf" font-weight="700">› </tspan><tspan fill="#4b5c56">type / for commands</tspan></text>

    <text x="24" y="532" font-size="12.5" fill="#4b5c56">↑↓ history · / commands · pgup/pgdn scroll · ctrl+c quit</text>
  </g>
</svg>
