[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trqsh"
version = "0.1.2"
description = "Expose localhost to the internet — fast QUIC tunnels with a desktop app. Installs the trqsh CLI binary for your platform."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [{ name = "Otabek Hamroqulov", email = "ops@trqsh.uz" }]
keywords = ["trqsh", "tunnel", "localhost", "ngrok-alternative", "quic", "http3", "webhook"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://trqsh.uz"
Documentation = "https://trqsh.uz/docs"
Source = "https://github.com/trqsh-uz/cli"
Issues = "https://github.com/trqsh-uz/cli/issues"

[project.scripts]
trqsh = "trqsh.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trqsh"]

[tool.hatch.build.targets.sdist]
include = ["src/trqsh", "README.md"]
